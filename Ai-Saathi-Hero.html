<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI Saathi Hero</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(0,170,255,.16),
      transparent 28%
    ),
    radial-gradient(
      circle at 15% 80%,
      rgba(0,110,255,.10),
      transparent 25%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(90,0,255,.08),
      transparent 25%
    ),
    #020611;

  color:white;

}


/* ==================================================
   MAIN HERO
================================================== */

.hero{

  position:relative;

  width:100%;
  min-height:500px;

  overflow:hidden;

  display:flex;

  align-items:center;
  justify-content:center;

  background:

    linear-gradient(
      rgba(2,6,17,.25),
      rgba(2,6,17,.72)
    );

}


/* ==================================================
   STAR FIELD
================================================== */

.stars{

  position:absolute;

  inset:0;

  overflow:hidden;

}

.star{

  position:absolute;

  width:2px;
  height:2px;

  border-radius:50%;

  background:#fff;

  opacity:.55;

  animation:
    starMove
    linear
    infinite;

}

@keyframes starMove{

  0%{
    transform:translateY(0);
    opacity:0;
  }

  15%{
    opacity:.7;
  }

  80%{
    opacity:.45;
  }

  100%{
    transform:translateY(-120px);
    opacity:0;
  }

}


/* ==================================================
   GLOW ORBS
================================================== */

.orb{

  position:absolute;

  border-radius:50%;

  filter:blur(2px);

  pointer-events:none;

}

.orb.one{

  width:330px;
  height:330px;

  background:
    radial-gradient(
      circle,
      rgba(0,210,255,.18),
      transparent 68%
    );

  left:-100px;
  top:80px;

  animation:
    orbOne
    8s
    ease-in-out
    infinite;

}

.orb.two{

  width:400px;
  height:400px;

  background:
    radial-gradient(
      circle,
      rgba(40,80,255,.16),
      transparent 68%
    );

  right:-130px;
  bottom:-100px;

  animation:
    orbTwo
    10s
    ease-in-out
    infinite;

}

@keyframes orbOne{

  0%,100%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(80px,-30px);
  }

}

@keyframes orbTwo{

  0%,100%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(-60px,-40px);
  }

}


/* ==================================================
   TECH GRID
================================================== */

.grid{

  position:absolute;

  left:-10%;
  right:-10%;

  bottom:-180px;

  height:350px;

  transform:
    perspective(500px)
    rotateX(63deg);

  background-image:

    linear-gradient(
      rgba(0,215,255,.14) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(0,215,255,.14) 1px,
      transparent 1px
    );

  background-size:
    55px 55px;

  mask-image:
    linear-gradient(
      to top,
      black,
      transparent
    );

  animation:
    gridMove
    5s
    linear
    infinite;

}

@keyframes gridMove{

  from{
    background-position:
      0 0,
      0 0;
  }

  to{
    background-position:
      0 55px,
      55px 0;
  }

}


/* ==================================================
   CENTER RING
================================================== */

.ring{

  position:absolute;

  width:360px;
  height:360px;

  border-radius:50%;

  border:

    1px solid
    rgba(0,220,255,.25);

  box-shadow:

    0 0 30px
    rgba(0,190,255,.10),

    inset 0 0 30px
    rgba(0,190,255,.08);

  animation:

    ringRotate
    18s
    linear
    infinite;

}

.ring::before{

  content:"";

  position:absolute;

  inset:25px;

  border-radius:50%;

  border:

    1px solid
    rgba(0,150,255,.18);

}

.ring::after{

  content:"";

  position:absolute;

  inset:-18px;

  border-radius:50%;

  border:

    1px dashed
    rgba(0,220,255,.12);

}

@keyframes ringRotate{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}


/* ==================================================
   LIGHT SWEEP
================================================== */

.sweep{

  position:absolute;

  width:150%;
  height:2px;

  background:

    linear-gradient(
      90deg,
      transparent,
      rgba(0,220,255,.8),
      white,
      rgba(0,220,255,.8),
      transparent
    );

  filter:

    blur(.5px)
    drop-shadow(
      0 0 15px
      rgba(0,220,255,.8)
    );

  transform:
    rotate(-7deg);

  animation:

    sweepMove
    5s
    ease-in-out
    infinite;

  opacity:.65;

}

@keyframes sweepMove{

  0%{
    left:-100%;
  }

  50%{
    left:0%;
  }

  100%{
    left:100%;
  }

}


/* ==================================================
   CONTENT
================================================== */

.content{

  position:relative;

  z-index:10;

  text-align:center;

  width:min(900px,92%);

  padding:30px;

  transform:
    translateY(0);

  animation:
    contentFloat
    6s
    ease-in-out
    infinite;

}

@keyframes contentFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-7px);
  }

}


/* ==================================================
   SMALL LABEL
================================================== */

.eyebrow{

  display:inline-flex;

  align-items:center;

  gap:10px;

  padding:

    9px 17px;

  border:

    1px solid
    rgba(0,220,255,.28);

  border-radius:50px;

  background:

    rgba(0,180,255,.055);

  backdrop-filter:
    blur(12px);

  color:

    #7ceeff;

  font-size:10px;

  font-weight:900;

  letter-spacing:4px;

  box-shadow:

    0 0 25px
    rgba(0,190,255,.08);

  animation:
    badgeGlow
    3s
    ease-in-out
    infinite;

}

.eyebrow::before{

  content:"";

  width:6px;
  height:6px;

  border-radius:50%;

  background:#00eaff;

  box-shadow:
    0 0 12px
    #00eaff;

}

@keyframes badgeGlow{

  0%,100%{
    box-shadow:
      0 0 20px
      rgba(0,190,255,.05);
  }

  50%{
    box-shadow:
      0 0 35px
      rgba(0,190,255,.18);
  }

}


/* ==================================================
   TITLE
================================================== */

.title{

  margin-top:25px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      54px,
      9vw,
      105px
    );

  line-height:.9;

  font-weight:900;

  letter-spacing:-4px;

  color:#fff;

  text-shadow:

    0 0 10px
    rgba(255,255,255,.8),

    0 0 30px
    rgba(0,200,255,.45),

    0 0 70px
    rgba(0,100,255,.25);

  animation:

    titlePulse
    4s
    ease-in-out
    infinite;

}

.title span{

  background:

    linear-gradient(
      90deg,
      #ffffff,
      #83edff,
      #00cfff,
      #ffffff
    );

  background-size:
    250% auto;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  animation:
    textFlow
    5s
    linear
    infinite;

}

@keyframes textFlow{

  0%{
    background-position:0% center;
  }

  100%{
    background-position:250% center;
  }

}

@keyframes titlePulse{

  0%,100%{
    filter:
      brightness(1);
  }

  50%{
    filter:
      brightness(1.12);
  }

}


/* ==================================================
   SUBTITLE
================================================== */

.subtitle{

  margin-top:22px;

  color:
    rgba(220,240,255,.78);

  font-size:
    clamp(
      12px,
      2vw,
      16px
    );

  letter-spacing:
    5px;

  font-weight:
    700;

}


/* ==================================================
   FEATURE PILLS
================================================== */

.features{

  margin-top:30px;

  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:9px;

}

.feature{

  padding:
    9px 14px;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:
    9px;

  background:
    rgba(255,255,255,.035);

  backdrop-filter:
    blur(12px);

  color:
    #a9bdcc;

  font-size:
    9px;

  font-weight:
    900;

  letter-spacing:
    1.5px;

  transition:
    .3s ease;

}

.feature:hover{

  color:#fff;

  border-color:
    rgba(0,220,255,.45);

  background:
    rgba(0,220,255,.08);

  transform:
    translateY(-3px);

  box-shadow:
    0 8px 30px
    rgba(0,180,255,.08);

}


/* ==================================================
   BOTTOM GLOW
================================================== */

.bottomGlow{

  position:absolute;

  width:70%;

  height:100px;

  bottom:-70px;

  left:15%;

  background:

    radial-gradient(
      ellipse,
      rgba(0,210,255,.25),
      transparent 70%
    );

  filter:blur(20px);

}


/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:600px){

  .hero{
    min-height:460px;
  }

  .ring{
    width:280px;
    height:280px;
  }

  .title{
    letter-spacing:-2px;
  }

  .subtitle{
    letter-spacing:2px;
    line-height:1.6;
  }

  .features{
    gap:6px;
  }

  .feature{
    font-size:8px;
    padding:8px 10px;
  }

}

</style>
</head>


<body>


<section class="hero">


  <!-- BACKGROUND STARS -->

  <div class="stars" id="stars"></div>


  <!-- GLOW -->

  <div class="orb one"></div>

  <div class="orb two"></div>


  <!-- GRID -->

  <div class="grid"></div>


  <!-- CENTER RING -->

  <div class="ring"></div>


  <!-- LIGHT SWEEP -->

  <div class="sweep"></div>


  <!-- MAIN CONTENT -->

  <div class="content">

    <div class="eyebrow">
      SMART AI • BETTER TOMORROW
    </div>


    <div class="title">

      <span>Ai Saathi</span>

    </div>


    <div class="subtitle">

      YOUR PERSONAL AI COMPANION

    </div>


    <div class="features">

      <div class="feature">
        ✦ EXPLORE
      </div>

      <div class="feature">
        ✦ LEARN
      </div>

      <div class="feature">
        ✦ CREATE
      </div>

      <div class="feature">
        ✦ GROW
      </div>

      <div class="feature">
        ✦ DISCOVER AI
      </div>

    </div>

  </div>


  <div class="bottomGlow"></div>


</section>


<script>

/* ==========================================
   CREATE ANIMATED STARS
========================================== */

const stars =
  document.getElementById("stars");

for(let i=0;i<110;i++){

  const star =
    document.createElement("div");

  star.className="star";

  star.style.left =
    Math.random()*100+"%";

  star.style.top =
    Math.random()*120+"%";

  const size =
    Math.random()*2+1;

  star.style.width =
    size+"px";

  star.style.height =
    size+"px";

  star.style.animationDuration =
    (5+Math.random()*12)+"s";

  star.style.animationDelay =
    (-Math.random()*15)+"s";

  stars.appendChild(star);

}


/* ==========================================
   MOUSE PARALLAX
========================================== */

const hero =
  document.querySelector(".hero");

const ring =
  document.querySelector(".ring");

const content =
  document.querySelector(".content");

hero.addEventListener(
  "mousemove",
  function(e){

    const rect =
      hero.getBoundingClientRect();

    const x =
      (e.clientX-rect.left)/rect.width-.5;

    const y =
      (e.clientY-rect.top)/rect.height-.5;


    ring.style.transform =
      `translate(${x*18}px,${y*18}px)`;


    content.style.transform =
      `translate(${x*-7}px,${y*-7}px)`;

  }
);


hero.addEventListener(
  "mouseleave",
  function(){

    ring.style.transform="";

    content.style.transform="";

  }
);

</script>

</body>
</html>
