<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Saathi - Login</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#071a3d,#123f7a);
}
.card{
  width:92%;
  max-width:420px;
  background:white;
  padding:38px 30px;
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  text-align:center;
}
.logo{font-size:48px}
h1{margin:10px 0 5px;color:#123f7a}
p{color:#666}
input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#e31b23;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.link{
  margin-top:16px;
  color:#123f7a;
  cursor:pointer;
  font-size:14px;
}
#message{
  margin-top:15px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">🤖</div>
  <h1>AI Saathi</h1>
  <p>Login to continue</p>

  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">🔐 Login</button>

  <div class="link" onclick="forgotPassword()">Forgot Password?</div>
  <div class="link" onclick="goHome()">← Back to AI Saathi</div>

  <div id="message"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCDmMjTED7rRTz9UcKyJ_MipmTnSMFOdvI",
  authDomain: "ai-saathi-1b460.firebaseapp.com",
  projectId: "ai-saathi-1b460",
  storageBucket: "ai-saathi-1b460.firebasestorage.app",
  messagingSenderId: "989761556178",
  appId: "1:989761556178:web:81256fc1e710e3b972270b",
  measurementId: "G-PB8R9D9N0D"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;
  const msg=document.getElementById("message");

  if(!email || !password){
    msg.style.color="red";
    msg.innerText="Please enter email and password.";
    return;
  }

  auth.signInWithEmailAndPassword(email,password)
    .then(()=>{
      msg.style.color="green";
      msg.innerText="Login successful!";
    })
    .catch(error=>{
      msg.style.color="red";
      msg.innerText=error.message;
    });
}

function forgotPassword(){
  const email=document.getElementById("email").value;
  const msg=document.getElementById("message");

  if(!email){
    msg.style.color="red";
    msg.innerText="Please enter your email first.";
    return;
  }

  auth.sendPasswordResetEmail(email)
    .then(()=>{
      msg.style.color="green";
      msg.innerText="Password reset email sent.";
    })
    .catch(error=>{
      msg.style.color="red";
      msg.innerText=error.message;
    });
}

function goHome(){
  window.location.href="https://sites.google.com/view/aisathi/home";
}
</script>

</body>
</html>
