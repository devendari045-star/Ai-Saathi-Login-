<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Saathi Login</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;

  background:
    radial-gradient(circle at 20% 20%,#075cff55,transparent 35%),
    radial-gradient(circle at 80% 80%,#00d9ff33,transparent 35%),
    #020617;
}

body:before{
  content:"";
  position:fixed;
  inset:0;

  background:
    linear-gradient(#ffffff08 1px,transparent 1px),
    linear-gradient(90deg,#ffffff08 1px,transparent 1px);

  background-size:45px 45px;

  pointer-events:none;
}

.box{
  width:min(450px,90%);

  padding:40px;

  text-align:center;

  border:1px solid #ffffff18;
  border-radius:28px;

  background:#ffffff0b;

  backdrop-filter:blur(20px);

  box-shadow:
    0 0 50px #008cff25;
}

.logo{
  font-size:34px;
  font-weight:800;
}

.logo span{
  color:#29d9ff;
}

.subtitle{
  margin-top:10px;
  color:#9caed0;
  line-height:1.5;
}

button{
  width:100%;

  margin-top:30px;

  padding:15px;

  border:0;

  border-radius:14px;

  color:white;

  background:
    linear-gradient(90deg,#075cff,#00c6ff);

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:0 0 25px #008cff35;
}

button:hover{
  opacity:.9;
  transform:translateY(-1px);
}

.status{
  margin-top:20px;

  min-height:22px;

  color:#40dcff;

  font-size:14px;
}

</style>

</head>

<body>


<div class="box">

  <div class="logo">
    🤖 AI <span>Saathi</span>
  </div>

  <p class="subtitle">
    Login to AI Saathi and access your personalized AI Rewards Dashboard.
  </p>


  <button id="loginButton" onclick="loginWithGoogle()">
    🔐 Continue with Google
  </button>


  <div class="status" id="status"></div>

</div>


<script>


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCDmMjTED7rRTz9UcKyJ_MipMtnSMFOdvI",

  authDomain:
  "ai-saathi-1b460.firebaseapp.com",

  projectId:
  "ai-saathi-1b460",

  storageBucket:
  "ai-saathi-1b460.firebasestorage.app",

  messagingSenderId:
  "989761556178",

  appId:
  "1:989761556178:web:81256fc1e710e3b972270b",

  measurementId:
  "G-PB8R9D9N0D"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const provider =
new firebase.auth.GoogleAuthProvider();

provider.setCustomParameters({
  prompt:"select_account"
});


/* =========================================
   DASHBOARD URL
========================================= */

const DASHBOARD_URL =
"https://devendari045-star.github.io/Ai-Saathi-Login-/dashboard.html";


/* =========================================
   GOOGLE LOGIN
========================================= */

async function loginWithGoogle(){

  const button =
  document.getElementById("loginButton");

  const status =
  document.getElementById("status");


  button.disabled = true;

  button.innerText =
  "🔄 Connecting...";

  status.innerText =
  "Please complete Google login.";


  try{

    const result =
    await auth.signInWithPopup(provider);


    if(result.user){

      status.innerText =
      "✅ Login successful! Opening Rewards Dashboard...";


      /*
       IMPORTANT:
       Successful login goes directly
       to dashboard.html
      */

      window.location.replace(
        DASHBOARD_URL
      );

    }

  }

  catch(error){

    console.error(error);

    button.disabled = false;

    button.innerText =
    "🔐 Continue with Google";


    if(error.code ===
       "auth/popup-closed-by-user"){

      status.innerText =
      "Login cancelled. Please try again.";

    }

    else if(error.code ===
            "auth/popup-blocked"){

      status.innerText =
      "Popup blocked. Please allow popups for this site.";

    }

    else{

      status.innerText =
      "⚠️ Login failed: " +
      error.message;

    }

  }

}


/* =========================================
   CHECK EXISTING LOGIN
========================================= */

auth.onAuthStateChanged(function(user){

  if(user){

    /*
      If already logged in,
      show dashboard directly.
    */

    window.location.replace(
      DASHBOARD_URL
    );

  }

});


</script>

</body>
</html>
