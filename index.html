<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Saathi - Login</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#071a3d,#123f7a);
}

.card{
  width:92%;
  max-width:430px;
  background:#fff;
  padding:40px 30px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.30);
}

.logo{
  font-size:52px;
  margin-bottom:8px;
}

h1{
  margin:5px 0;
  color:#123f7a;
  font-size:30px;
}

.subtitle{
  color:#666;
  margin-bottom:28px;
}

.google-btn{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:11px;
  background:#fff;
  color:#333;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.google-btn:hover{
  background:#f7f7f7;
}

.back{
  display:block;
  margin-top:22px;
  color:#123f7a;
  text-decoration:none;
  font-size:14px;
}

#message{
  margin-top:18px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">🤖</div>

  <h1>AI Saathi</h1>

  <div class="subtitle">
    Login to continue
  </div>

  <button class="google-btn" onclick="googleLogin()">
    🔵 Continue with Google
  </button>

  <a class="back" href="https://sites.google.com/view/aisathi/home">
    ← Back to AI Saathi
  </a>

  <div id="message"></div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCDmMjTED7rRTz9UcKyJ_MipmTnSMFOdvI",
  authDomain: "ai-saathi-1b460.firebaseapp.com",
  projectId: "ai-saathi-1b460",
  storageBucket: "ai-saathi-1b460.firebasestorage.app",
  messagingSenderId: "989761556178",
  appId: "1:989761556178:web:81256fc1e710e3b972270b",
  measurementId: "G-PB8R9D9N0D"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const provider = new firebase.auth.GoogleAuthProvider();

function googleLogin(){

  const message = document.getElementById("message");

  message.style.color = "#123f7a";
  message.innerText = "Opening Google Login...";

  auth.signInWithPopup(provider)

    .then((result) => {

      message.style.color = "green";
      message.innerText = "Login successful!";

    })

    .catch((error) => {

      console.error(error);

      message.style.color = "red";
      message.innerText = error.message;

    });
}

</script>

</body>
</html>
